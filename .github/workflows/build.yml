name: Build OpenWrt with OpenClash + Mihomo + Sing-box + OAF

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo swapoff -a 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential ccache curl file g++ gawk gettext git libelf-dev libncurses5-dev libssl-dev python3 python3-pip rsync subversion swig time unzip wget xsltproc zlib1g-dev

      - name: Clone OpenWrt
        run: git clone --depth=1 https://git.openwrt.org/openwrt/openwrt.git openwrt

      - name: Add feeds
        run: |
          cd openwrt
          echo "src-git openclash https://github.com/vernesong/OpenClash.git" >> feeds.conf
          echo "src-git mihomo https://github.com/nikkinikki-org/OpenWrt-mihomo.git" >> feeds.conf
          echo "src-git singbox https://github.com/yichya/luci-app-sing-box.git" >> feeds.conf
          echo "src-git OAF https://github.com/destan19/OpenAppFilter.git" >> feeds.conf

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: Configure
        run: |
          cd openwrt
          {
            echo CONFIG_TARGET_x86=y
            echo CONFIG_TARGET_x86_64=y
            echo CONFIG_TARGET_x86_64_Generic=y
            echo CONFIG_PACKAGE_luci=y
            echo CONFIG_PACKAGE_luci-ssl=y
            echo CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
            echo CONFIG_PACKAGE_luci-i18n-openclash-zh-cn=y
            echo CONFIG_PACKAGE_luci-i18n-mihomo-zh-cn=y
            echo CONFIG_PACKAGE_luci-i18n-sing-box-zh-cn=y
            echo CONFIG_PACKAGE_luci-app-openclash=y
            echo CONFIG_PACKAGE_luci-app-mihomo=y
            echo CONFIG_PACKAGE_luci-app-sing-box=y
            echo CONFIG_PACKAGE_sing-box=y
            echo CONFIG_PACKAGE_luci-app-oaf=y
            echo CONFIG_PACKAGE_luci-app-eqos=y
            echo CONFIG_PACKAGE_luci-app-accesscontrol=y
            echo CONFIG_PACKAGE_curl=y
            echo CONFIG_PACKAGE_htop=y
            echo CONFIG_PACKAGE_kmod-usb3=y
            echo CONFIG_IPV6=y
            echo CONFIG_CCACHE=y
            echo 'CONFIG_VERSION_DIST="OpenWrt2026"'
          } >> .config
          sed -i 's|192.168.1.1|10.0.0.2|g' package/base-files/files/bin/config_generate
          make defconfig

      - name: Download sources
        run: cd openwrt && set -o pipefail; make download -j$(nproc) V=s 2>&1 | tail -20

      - name: Build
        run: cd openwrt && set -o pipefail; make -j$(nproc) V=s 2>&1 | tail -200

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-x86-64
          path: openwrt/bin/targets/x86/*
          retention-days: 7
