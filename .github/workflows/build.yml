name: Build OpenWrt with OpenClash + Nikki/Mihomo + Momo/Sing-box + OAF

permissions:
  contents: read

concurrency:
  group: openwrt-x86-64-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Free disk space
        run: |
          sudo swapoff -a 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache /usr/share/dotnet

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential ccache curl file g++ gawk gettext git libelf-dev libncurses5-dev libssl-dev python3 python3-distutils python3-pip rsync subversion swig time unzip wget xsltproc zlib1g-dev

      - name: Clone OpenWrt
        run: |
          git clone --depth=1 https://git.openwrt.org/openwrt/openwrt.git openwrt
          git -C openwrt fetch --depth=1 origin 5204715d14207efa956553d9d7079f6fa1aaea40
          git -C openwrt checkout --detach 5204715d14207efa956553d9d7079f6fa1aaea40

      - name: Add feeds
        run: |
          cd openwrt
          cat >> feeds.conf <<'EOF'
          src-git openclash https://github.com/vernesong/OpenClash.git^a9e5d98cd664917724dbfb0a31440e512ab45a1b
          src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git^34a036708c4e163f11194b2952cd87ef386486ed
          src-git momo https://github.com/nikkinikki-org/OpenWrt-momo.git^6fb94df155ac538b06a3c52c077ec6c05d353c0a
          src-git OAF https://github.com/destan19/OpenAppFilter.git^a189ad85e8fb461318533941963f0e2975274a19
          EOF

      - name: Update feeds
        run: cd openwrt && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt && ./scripts/feeds install -a

      - name: Configure
        run: |
          cd openwrt
          {
            echo CONFIG_TARGET_x86=y
            echo CONFIG_TARGET_x86_64=y
            echo CONFIG_TARGET_x86_64_DEVICE_generic=y
            echo CONFIG_PACKAGE_luci=y
            echo CONFIG_PACKAGE_luci-ssl=y
            echo CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
            echo CONFIG_PACKAGE_luci-app-openclash=y
            echo CONFIG_PACKAGE_nikki=y
            echo CONFIG_PACKAGE_luci-app-nikki=y
            echo CONFIG_PACKAGE_momo=y
            echo CONFIG_PACKAGE_luci-app-momo=y
            echo CONFIG_PACKAGE_appfilter=y
            echo CONFIG_PACKAGE_kmod-oaf=y
            echo CONFIG_PACKAGE_luci-app-oaf=y
            echo CONFIG_PACKAGE_curl=y
            echo CONFIG_PACKAGE_htop=y
            echo CONFIG_PACKAGE_iperf3=y
            echo CONFIG_PACKAGE_nano=y
            echo CONFIG_PACKAGE_tcpdump=y
            echo CONFIG_PACKAGE_kmod-usb3=y
            echo CONFIG_CCACHE=y
            echo 'CONFIG_VERSION_DIST="OpenWrt2026"'
          } >> .config
          sed -i 's|192.168.1.1|10.0.0.2|g' package/base-files/files/bin/config_generate
          make defconfig

      - name: Download sources
        run: |
          cd openwrt
          set -o pipefail
          make download -j"$(nproc)" V=s 2>&1 | tee download.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Build
        run: |
          cd openwrt
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Upload firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openwrt-x86-64
          path: openwrt/bin/targets/x86/*
          retention-days: 7
